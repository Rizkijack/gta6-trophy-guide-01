<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Trophy Guide & Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>GTA VI Trophy Guide</h1>
    <p class="sub">55 PS5 trophies &middot; tracker, roadmap, cited guides</p>
  </div>
  <div class="stats">
    <span id="progress">0 of 55 earned</span>
    <label class="toggle"><input type="checkbox" id="spoiler"> Spoiler mode (hide story trophies)</label>
  </div>
</header>

<nav class="views">
  <button data-view="checklist" class="active">Checklist</button>
  <button data-view="roadmap">Roadmap</button>
</nav>

<section class="filters">
  <input id="search" type="search" placeholder="Search trophies, guides, steps..." aria-label="Search">
  <select id="kind"><option value="all">All kinds</option><option value="story">Story</option><option value="missable">Missable</option><option value="collectible">Collectibles</option><option value="activity">Activities</option><option value="online">Online</option></select>
  <select id="grade"><option value="all">All grades</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select>
  <label class="toggle"><input type="checkbox" id="missableOnly"> Missable only</label>
  <button id="export" type="button">Export</button>
  <label class="import">Import <input id="import" type="file" accept="application/json"></label>
</section>

<main>
  <section id="view-checklist" class="view active">
    <div id="list" class="list"></div>
    <aside id="detail" class="detail"><p class="empty">Select a trophy to read its guide.</p></aside>
  </section>
  <section id="view-roadmap" class="view">
    <div id="roadmap"></div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
